name = "scheinerik"
compatibility_date = "2025-10-08"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = "out"

# functions/api/mockup.ts forwards capture requests to a separate Worker
# (workers/mockup-capture/) via this service binding, rather than launching
# Browser Rendering directly here — Cloudflare Pages Functions don't support
# Browser Rendering bindings at all (confirmed against Cloudflare's own
# binding compatibility docs: "Browser Run" is unsupported for Pages, only
# for genuine Workers). A [browser] binding block used to sit here instead;
# it passed this file's build-time validation but was never actually
# functional in production, which is why /api/mockup 504'd.
#
# The satellite Worker needs to be deployed separately: from the project
# root, `wrangler deploy` won't pick it up since this file's `name` targets
# the Pages project — deploy it explicitly with its own config, e.g.
#   cd workers/mockup-capture && wrangler deploy
[[services]]
binding = "MOCKUP_WORKER"
service = "scheinerik-mockup-capture"
