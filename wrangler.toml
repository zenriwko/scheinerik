name = "scheinerik"
compatibility_date = "2025-10-08"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = "out"

# Browser Rendering binding used by functions/api/mockup.ts to launch a
# headless Chromium session and capture screenshots server-side.
#
# Cloudflare Pages' Git-integration build reads this file directly and
# validates it against a Pages-specific schema that is stricter than plain
# Workers config: it rejects a top-level `account_id` ("Configuration file
# for Pages projects does not support account_id") and rejects `remote`
# under [browser] ("Unexpected fields found in browser field: remote").
# Both were here only to smooth out local `wrangler pages dev` — do not
# re-add them, they break production deploys.
#
# For local dev instead: run `wrangler pages dev out --remote` (Browser
# Rendering has no local emulation, so `--remote` is required every time),
# and make sure `wrangler login` is on the right account if you have more
# than one — there's no config-file equivalent of account_id here anymore.
[browser]
binding = "MYBROWSER"
