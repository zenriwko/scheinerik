compatibility_date = "2025-10-08"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = "out"

# Browser Rendering binding used by functions/api/mockup.ts to launch a
# headless Chromium session and capture screenshots server-side.
#
# Browser Rendering has no local emulation — even during `wrangler pages
# dev`, this binding always talks to Cloudflare's real remote service under
# your account (requires `wrangler login` + Browser Rendering enabled on the
# account). `remote = true` makes that happen automatically instead of
# requiring the `--remote` CLI flag on every run.
#
# This file only takes effect when deploying with `wrangler pages deploy`.
# If this project deploys via the Cloudflare dashboard's Git integration
# instead, add the same binding manually there:
#   Pages project -> Settings -> Functions -> Browser Rendering bindings
#   -> Variable name: MYBROWSER
[browser]
binding = "MYBROWSER"
remote = true
